[plugins]
modules = ["training_framework.plugins.qcresunet.components"]
[model]
name = "qcresunet"
modalities = 1
base_channels = 64
blocks = [3, 4, 6, 3]
dropout = 0.3
# Conventional ACDC labels: 1=RV, 2=myocardium, 3=LV.
regions = [[3], [2], [1]]
stem_stride = [1, 2, 2]
downsample_strides = [[1, 2, 2], [1, 2, 2], [1, 2, 2], [2, 2, 2]]
