[plugins]
modules = ["training_framework.plugins.qcresunet.components"]

[model]
name = "qcresunet"
modalities = 4
base_channels = 64
blocks = [3, 4, 6, 3]
dropout = 0.3
regions = [[1, 2, 3], [1, 3], [3]]
stem_stride = [2, 2, 2]
downsample_strides = [[2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 2]]
attention = true
