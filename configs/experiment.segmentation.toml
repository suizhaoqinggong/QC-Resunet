[experiment]
name = "example-segmentation"
seed = 42
class_names = ["background", "class_1", "class_2", "class_3"]
[data]
adapter = "dummy_segmentation"
num_samples = 20
num_modalities = 4
volume_size = [8, 8, 8]
batch_size = 2
num_workers = 0
val_ratio = 0.2
test_ratio = 0.2
[task]
name = "segmentation"
loss = "dice_ce"
[optimizer]
name = "adam"
lr = 0.001
[trainer]
epochs = 2
patience = 2
device = "cpu"
amp = false
[metrics.params.dice]
[metrics.params.iou]
[checkpoint]
monitor = "val_dice_mean"
mode = "max"
[output]
root_dir = "runs"
